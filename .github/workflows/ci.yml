name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.gradle'
      - 'gradle/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # release-please branches only bump a version string; nothing to test.
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run the hermetic suite
        run: ./gradlew check --no-daemon

      # Docker is available on ubuntu-latest, so the Testcontainers-backed tests
      # run here and only here — `./gradlew test` stays runnable on a laptop
      # without Docker.
      - name: Integration tests (Testcontainers Postgres)
        run: ./gradlew integrationTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only. Publishing happens on a release tag — see docker-publish.yml.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
