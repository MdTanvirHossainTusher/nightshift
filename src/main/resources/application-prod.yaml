# Production profile for Railway and cloud deployments
# Active when SPRING_PROFILES_ACTIVE=prod

spring:
  datasource:
    # Railway sets SPRING_DATASOURCE_URL; Render's blueprint supplies host/port/name separately.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

nightshift:
  log-root: ${NIGHTSHIFT_LOG_ROOT:/app/logs}
  workspace: ${NIGHTSHIFT_WORKSPACE:/app/workspace}
  llm:
    provider: ${NIGHTSHIFT_LLM_PROVIDER:heuristic}
  publish:
    dry-run: ${NIGHTSHIFT_PUBLISH_DRY_RUN:true}
  messaging:
    transport: ${NIGHTSHIFT_MESSAGING_TRANSPORT:local}

# Mail is optional in the cloud (no MailHog). Without this, an unreachable SMTP host marks
# /actuator/health DOWN and Render/Railway health checks never let the deploy go live.
management:
  health:
    mail:
      enabled: ${NIGHTSHIFT_MAIL_HEALTH:false}
